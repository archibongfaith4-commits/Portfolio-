    <a href="index.html" >Home</a>

    <a href="planner.html" class="active">Planner</a>
    <a href="contact.html" >Contact</a>
  </nav>
</header>
<main>
  <h1>Academic Planner</h1>
  <section class="card">
    <form id="task-form">
      <label for="task-input">New task</label>
      <div class="row">
        <input type="text" id="task-input" placeholder="e.g. Finish web assignment">
        <button type="submit" class="btn">Add</button>
      </div>
      <span class="error" id="task-error"></span>
    </form>
    <p id="task-count" class="muted"></p>
    <ul id="task-list" class="tasks"></ul>
  </section>
</main>
